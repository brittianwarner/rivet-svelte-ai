# Three replicas of the one image on a shared bucket, behind a round-robin edge.
# Local only: MinIO stands in for the S3 bucket, Caddy for Railway's edge.
#
#   docker compose -f deploy/compose.replicas.yml up --build -d
#   bun run test:deployment http://localhost:8080
#   docker compose -f deploy/compose.replicas.yml down -v
#
# Rehearse a deploy the way Railway runs one (new replicas start, overlap,
# then the old ones drain): see deploy/rehearse-deploy.sh.
#
# The same image split into tiers (3 engines, 2 runners, 2 fronts) on :8081:
#
#   docker compose -f deploy/compose.replicas.yml --profile tiers up -d \
#     engine1 engine2 engine3 runner1 runner2 front1 front2 edge-tiers
#   bun run test:deployment http://localhost:8081
#
# The credentials below are local placeholders. Never reuse them.
name: rivet-svelte-ai-replicas

x-app: &app
  build: { context: .., platforms: [linux/amd64] }
  image: rivet-svelte-ai:local
  platform: linux/amd64
  depends_on:
    bucket: { condition: service_completed_successfully }
    s3: { condition: service_healthy }
  # Railway's drain window. The engine hands its partitions off on SIGTERM;
  # cutting this short is how a deploy loses quorum.
  stop_grace_period: 660s
  volumes: ["s3-ca:/s3-ca:ro"]
  environment: &app-env
    ROLE: all
    PUBLIC_ORIGIN: http://localhost:8080
    RIVET_TOKEN: local-only-admin-token-0123456789abcdef0123456789abcdef
    ENTITY_SECRET: local-only-entity-secret-0123456789abcdef0123456789
    S3_BUCKET: rivet
    # Virtual-hosted, https: the endpoint becomes https://rivet.s3.local.
    S3_ENDPOINT: https://s3.local
    S3_REGION: us-east-1
    S3_ACCESS_KEY_ID: local-minio
    S3_SECRET_ACCESS_KEY: local-minio-secret
    # Trust the local CA only. Production uses the system store.
    SSL_CERT_FILE: /s3-ca/caddy/pki/authorities/local/root.crt

x-engine: &engine
  <<: *app
  profiles: [tiers]
  environment: &engine-env
    <<: *app-env
    ROLE: engine
    PORT: "6420"

# Runners and fronts hold no state: no bucket, no peer address.
x-tier: &tier
  image: rivet-svelte-ai:local
  platform: linux/amd64
  profiles: [tiers]
  depends_on: [engine1, engine2, engine3]
  stop_grace_period: 120s
  networks: [replicas]
  environment: &tier-env
    PUBLIC_ORIGIN: http://localhost:8081
    RIVET_ENDPOINT: http://engine:6420
    RIVET_TOKEN: local-only-admin-token-0123456789abcdef0123456789abcdef
    ENTITY_SECRET: local-only-entity-secret-0123456789abcdef0123456789

services:
  minio:
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: local-minio
      MINIO_ROOT_PASSWORD: local-minio-secret
      # Virtual-host addressing: rivet.s3.local is bucket "rivet".
      MINIO_DOMAIN: s3.local
    networks: { replicas: { ipv4_address: 172.28.0.10 } }
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      retries: 30

  bucket:
    image: minio/mc:latest
    depends_on: { minio: { condition: service_healthy } }
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 local-minio local-minio-secret &&
             mc mb --ignore-existing local/rivet"
    networks: [replicas]

  s3:
    image: caddy:2-alpine
    depends_on: { minio: { condition: service_healthy } }
    volumes: ["./Caddyfile.s3:/etc/caddy/Caddyfile:ro", "s3-ca:/data"]
    healthcheck:
      # Ready once the CA exists; expose only the public root cert, never the key.
      test:
        - CMD-SHELL
        - >-
          f=/data/caddy/pki/authorities/local/root.crt; test -f $$f &&
          chmod a+x /data/caddy /data/caddy/pki /data/caddy/pki/authorities /data/caddy/pki/authorities/local &&
          chmod a+r $$f
      interval: 1s
      retries: 30
    networks:
      replicas:
        aliases: [s3.local, rivet.s3.local]

  app1:
    <<: *app
    environment:
      { <<: *app-env, RIVET__API_PEER__ADVERTISE_ADDRESS: "172.28.0.11:6421" }
    networks: { replicas: { ipv4_address: 172.28.0.11 } }
  app2:
    <<: *app
    environment:
      { <<: *app-env, RIVET__API_PEER__ADVERTISE_ADDRESS: "172.28.0.12:6421" }
    networks: { replicas: { ipv4_address: 172.28.0.12 } }
  app3:
    <<: *app
    environment:
      { <<: *app-env, RIVET__API_PEER__ADVERTISE_ADDRESS: "172.28.0.13:6421" }
    networks: { replicas: { ipv4_address: 172.28.0.13 } }

  # The next release: same image, new disks, new addresses.
  app4:
    <<: *app
    profiles: [next]
    environment:
      { <<: *app-env, RIVET__API_PEER__ADVERTISE_ADDRESS: "172.28.0.14:6421" }
    networks: { replicas: { ipv4_address: 172.28.0.14 } }
  app5:
    <<: *app
    profiles: [next]
    environment:
      { <<: *app-env, RIVET__API_PEER__ADVERTISE_ADDRESS: "172.28.0.15:6421" }
    networks: { replicas: { ipv4_address: 172.28.0.15 } }
  app6:
    <<: *app
    profiles: [next]
    environment:
      { <<: *app-env, RIVET__API_PEER__ADVERTISE_ADDRESS: "172.28.0.16:6421" }
    networks: { replicas: { ipv4_address: 172.28.0.16 } }

  # --- Tiers: the same image, one service per role ---------------------------
  # Every engine answers to the name `engine`, like a Railway private domain.
  engine1:
    <<: *engine
    environment:
      {
        <<: *engine-env,
        RIVET__API_PEER__ADVERTISE_ADDRESS: "172.28.0.21:6421",
      }
    networks:
      replicas: { ipv4_address: 172.28.0.21, aliases: [engine] }
  engine2:
    <<: *engine
    environment:
      {
        <<: *engine-env,
        RIVET__API_PEER__ADVERTISE_ADDRESS: "172.28.0.22:6421",
      }
    networks:
      replicas: { ipv4_address: 172.28.0.22, aliases: [engine] }
  engine3:
    <<: *engine
    environment:
      {
        <<: *engine-env,
        RIVET__API_PEER__ADVERTISE_ADDRESS: "172.28.0.23:6421",
      }
    networks:
      replicas: { ipv4_address: 172.28.0.23, aliases: [engine] }
  runner1: { <<: *tier, environment: { <<: *tier-env, ROLE: runner } }
  runner2: { <<: *tier, environment: { <<: *tier-env, ROLE: runner } }
  front1: { <<: *tier, environment: { <<: *tier-env, ROLE: front } }
  front2: { <<: *tier, environment: { <<: *tier-env, ROLE: front } }
  edge-tiers:
    image: caddy:2-alpine
    profiles: [tiers]
    ports: ["8081:8080"]
    volumes: ["./Caddyfile.tiers:/etc/caddy/Caddyfile:ro"]
    depends_on: [front1, front2]
    networks: [replicas]

  edge:
    image: caddy:2-alpine
    ports: ["8080:8080"]
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro"]
    depends_on: [app1, app2, app3]
    networks: [replicas]

volumes:
  s3-ca:

networks:
  replicas:
    ipam:
      config: [{ subnet: 172.28.0.0/24 }]
